[project]
name = "concevez-et-d-ployez-un-syst-me-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-mistralai>=1.1.6",
    "matplotlib>=3.11.2",
    "mistralai>=3.2.0",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "langchain-google-vertexai>=3.2.5",
    "pytest>=8.4",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --cov=utils --cov-report=term-missing --cov-report=html --cov-fail-under=90"
markers = [
    "unit: tests unitaires des fonctions de préparation",
    "functional: tests du parcours de préparation avec fichiers temporaires",
]

[tool.coverage.run]
branch = true
data_file = "tests/.coverage"

[tool.coverage.html]
directory = "tests/htmlcov"
